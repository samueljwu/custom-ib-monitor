name: Desktop bundles

on:
  workflow_dispatch:
    inputs:
      target:
        description: Native target to build
        type: choice
        options: [both, windows, macos]
        default: both

jobs:
  windows:
    if: ${{ inputs.target != 'macos' }}
    runs-on: windows-2025
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python packaging/check_release.py
      - run: python packaging/collect_licenses.py
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm packaging/portfolio_monitor.spec
      - run: |
          $process = Start-Process -FilePath (Resolve-Path .\dist\PortfolioMonitor\PortfolioMonitor.exe) -ArgumentList '--bundle-check' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Bundle check failed: $($process.ExitCode)" }
      - run: choco install innosetup --no-progress -y
      - run: ./packaging/windows/build_installer.ps1
      - name: Install, upgrade, and uninstall with synthetic data
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist/installers/*-windows-x64-setup.exe).FullName
          $appDir = Join-Path $env:RUNNER_TEMP 'PortfolioMonitorInstalled'
          $marker = Join-Path $env:LOCALAPPDATA 'CustomIBMonitor/prod/data/installer-smoke-marker.txt'
          New-Item -ItemType Directory -Force -Path (Split-Path $marker) | Out-Null
          Set-Content -LiteralPath $marker -Value 'synthetic installer check'
          foreach ($attempt in 1..2) {
            $setup = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=$appDir" -Wait -PassThru -WindowStyle Hidden
            if ($setup.ExitCode -ne 0) { throw "Install failed: $($setup.ExitCode)" }
            $check = Start-Process -FilePath (Join-Path $appDir 'PortfolioMonitor.exe') -ArgumentList '--bundle-check' -Wait -PassThru -WindowStyle Hidden
            if ($check.ExitCode -ne 0) { throw "Installed app check failed: $($check.ExitCode)" }
            if (!(Test-Path -LiteralPath $marker)) { throw 'User data disappeared during install.' }
          }
          $uninstall = Start-Process -FilePath (Join-Path $appDir 'unins000.exe') -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru -WindowStyle Hidden
          if ($uninstall.ExitCode -ne 0) { throw "Uninstall failed: $($uninstall.ExitCode)" }
          if (!(Test-Path -LiteralPath $marker)) { throw 'Uninstall removed user data.' }
          if (Test-Path -LiteralPath (Join-Path $appDir 'PortfolioMonitor.exe')) { throw 'Uninstall left the executable.' }
      - uses: actions/upload-artifact@v4
        with:
          name: PortfolioMonitor-windows-x64-setup
          path: dist/installers/*-windows-x64-setup.exe
      - run: |
          $version = python -c 'from app.version import VERSION; print(VERSION)'
          git archive --format=zip --output="dist/installers/PortfolioMonitor-$version-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: PortfolioMonitor-source
          path: dist/installers/*-source.zip

  macos:
    if: ${{ inputs.target != 'windows' }}
    runs-on: macos-15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - run: python -m pip install -r requirements-dev.txt
      - run: python packaging/check_release.py
      - run: python packaging/collect_licenses.py
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm packaging/portfolio_monitor.spec
      - run: dist/PortfolioMonitor.app/Contents/MacOS/PortfolioMonitor --bundle-check
      - run: file dist/PortfolioMonitor.app/Contents/MacOS/PortfolioMonitor | grep arm64
      - run: |
          version=$(python -c 'from app.version import VERSION; print(VERSION)')
          sh packaging/macos/build_dmg.sh dist/PortfolioMonitor.app "dist/installers/PortfolioMonitor-${version}-macos-arm64.dmg"
          hdiutil verify "dist/installers/PortfolioMonitor-${version}-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: PortfolioMonitor-macos-arm64-dmg
          path: dist/installers/*-macos-arm64.dmg
